# Builds the images from the local workspace (repositories side by side),
# as long as the packages and images are not published.
services:
  server:
    image: agenteca-server:dev
    build:
      context: ..
      dockerfile: agenteca-server/docker/Dockerfile.workspace
  web:
    image: agenteca-web:dev
    build:
      context: ../agenteca-web
