# Self-hosting in one command:  docker compose up -d
# The catalog is served on http://localhost:3000, the API on http://localhost:8080.
#
# These images are not published yet. Until then, build them from source:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  server:
    image: ghcr.io/agenteca/agenteca-server:0.1.0
    restart: unless-stopped
    environment:
      AGENTECA_PUBLIC_URL: ${AGENTECA_PUBLIC_URL:-http://localhost:8080}
      # First start only. Without a password, a random password is generated
      # and printed once in the logs (docker compose logs server).
      AGENTECA_ADMIN_EMAIL: ${AGENTECA_ADMIN_EMAIL:-admin@localhost}
      AGENTECA_ADMIN_PASSWORD: ${AGENTECA_ADMIN_PASSWORD:-}
    volumes:
      - agenteca-data:/data
    ports:
      - '8080:8080'

  web:
    image: ghcr.io/agenteca/agenteca-web:0.1.0
    restart: unless-stopped
    environment:
      AGENTECA_API_URL: http://server:8080
    ports:
      - '3000:3000'
    depends_on:
      server:
        condition: service_healthy

volumes:
  agenteca-data:
