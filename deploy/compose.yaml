# Production deployment: Caddy (HTTPS) in front of the API server and the web catalog.
#
#   cp .env.example .env      # then edit .env
#   docker compose up -d
#
# Caddy obtains and renews the TLS certificate by itself. The domain's DNS record
# must already point at this machine, and ports 80 and 443 must be reachable.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      AGENTECA_DOMAIN: ${AGENTECA_DOMAIN:?set AGENTECA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
      - web

  server:
    image: ghcr.io/agenteca/agenteca-server:${AGENTECA_VERSION:-latest}
    restart: unless-stopped
    environment:
      AGENTECA_PUBLIC_URL: https://${AGENTECA_DOMAIN}
      AGENTECA_ADMIN_EMAIL: ${AGENTECA_ADMIN_EMAIL:?set AGENTECA_ADMIN_EMAIL in .env}
      # First start only. Leave empty to get a random password printed once in the logs:
      #   docker compose logs server
      AGENTECA_ADMIN_PASSWORD: ${AGENTECA_ADMIN_PASSWORD:-}
    volumes:
      - agenteca-data:/data

  web:
    image: ghcr.io/agenteca/agenteca-web:${AGENTECA_VERSION:-latest}
    restart: unless-stopped
    environment:
      AGENTECA_API_URL: http://server:8080
    depends_on:
      server:
        condition: service_healthy

volumes:
  agenteca-data:
  caddy-data:
  caddy-config:
