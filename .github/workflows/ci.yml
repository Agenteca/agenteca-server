name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/agenteca-core
          path: agenteca-core
      - uses: actions/checkout@v4
        with:
          path: agenteca-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Agenteca repositories are linked through an npm workspace, as in development.
      - name: Workspace
        run: |
          echo '{"private": true, "workspaces": ["agenteca-core", "agenteca-server"]}' > package.json
          npm install --no-audit --no-fund
      - name: Build agenteca-core
        run: npm run build -w agenteca-core
      - name: Lint
        run: npm run lint
        working-directory: agenteca-server
      - name: Build
        run: npm run build
        working-directory: agenteca-server
      - name: Types
        run: npm run typecheck
        working-directory: agenteca-server
      - name: Tests
        run: npm test
        working-directory: agenteca-server
